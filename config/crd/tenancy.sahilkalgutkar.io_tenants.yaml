---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: tenants.tenancy.sahilkalgutkar.io
spec:
  group: tenancy.sahilkalgutkar.io
  names:
    categories:
    - tenancy
    kind: Tenant
    listKind: TenantList
    plural: tenants
    shortNames:
    - tn
    singular: tenant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.desiredReplicas
      name: Desired
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Tenant is one customer's slice of the cluster: a namespace, the guard rails
          on it, and the workload that runs inside it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenantSpec is the whole contract a platform team writes against.
            properties:
              contactEmail:
                description: |-
                  ContactEmail is who to page about this tenant. I surface it on the
                  namespace as a label-safe annotation so it shows up in alerts routed by
                  namespace rather than by tenant.
                type: string
              displayName:
                description: |-
                  DisplayName is the human-readable name of the customer this tenant is
                  for. It never has to be DNS-safe, which is exactly why it is separate
                  from the object name.
                maxLength: 128
                minLength: 1
                type: string
              image:
                description: |-
                  Image is the tenant workload's container image. It must carry an
                  explicit tag or digest — see the validating webhook for why a floating
                  tag is rejected rather than merely discouraged.
                minLength: 1
                type: string
              namespace:
                description: |-
                  Namespace is the namespace I provision for this tenant. It defaults to
                  "tenant-<name>" and is immutable afterwards: changing it would orphan
                  every object I had already created.
                maxLength: 63
                type: string
              replicas:
                description: |-
                  Replicas overrides the tier's default replica count. It is still capped
                  by the tier's maximum, so this is a way to run smaller than the tier
                  allows, not a way to escape it.
                format: int32
                minimum: 0
                type: integer
              suspended:
                default: false
                description: |-
                  Suspended scales the tenant's workload to zero without deleting
                  anything. This is what I want when a customer stops paying: the data,
                  the namespace and the quota all survive, and un-suspending is a one-word
                  edit rather than a re-provision.
                type: boolean
              tier:
                default: standard
                description: Tier drives the tenant's replica bounds and resource
                  quota.
                enum:
                - free
                - standard
                - enterprise
                type: string
            required:
            - displayName
            - image
            type: object
          status:
            description: TenantStatus is everything I observe, never anything I am
              told.
            properties:
              conditions:
                description: Conditions are the real state. Ready is the roll-up of
                  the others.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsSecret:
                description: |-
                  CredentialsSecret is the name of the Secret in the tenant's namespace
                  holding its generated API key.
                type: string
              desiredReplicas:
                description: |-
                  DesiredReplicas is what I asked for, after the tier cap and suspension
                  have been applied. Having both numbers on the status means a human can
                  see "0 of 0" (suspended) and "0 of 3" (broken) without going digging.
                format: int32
                type: integer
              namespace:
                description: Namespace is the namespace I actually provisioned.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation this status was computed from.
                  Without it, a stale Ready=True is indistinguishable from a current one.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse summary shown in `kubectl get tenants`.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Suspended
                - Degraded
                - Terminating
                type: string
              readyReplicas:
                description: |-
                  ReadyReplicas is the number of workload replicas currently ready. It is
                  serialised even when it is zero, so that `kubectl get tenants` shows a
                  real "0" rather than a blank column that reads as missing data.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
