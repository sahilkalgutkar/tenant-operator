name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./api ./internal)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The generated CRD and RBAC manifests are committed, so a change to the
      # API types that was not regenerated would otherwise ship a CRD that does
      # not match the Go types it is supposed to describe.
      - name: generated manifests are up to date
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.2 \
            object:headerFile=/dev/null paths=./api/...
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.2 \
            crd rbac:roleName=manager-role webhook paths=./... \
            output:crd:artifacts:config=config/crd \
            output:rbac:artifacts:config=config/rbac \
            output:webhook:artifacts:config=config/webhook
          if ! git diff --exit-code; then
            echo "the generated manifests are out of date: run 'make manifests generate'"
            exit 1
          fi

      - name: install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.20
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.32.0 -p path)" >> "$GITHUB_ENV"

      # The controller suite runs against a real API server. Without the race
      # detector a controller's test run says very little: everything
      # interesting here happens on a workqueue goroutine.
      - name: test
        run: go test -race -count=1 -timeout 10m ./...

      - name: coverage
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=cover.out -timeout 10m ./...

      - name: coverage summary
        run: go tool cover -func=cover.out | tail -1

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover.out
          fail_ci_if_error: false

  manifests:
    name: install manifests render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A manifest set that does not render is an operator nobody can install,
      # and it is exactly the kind of breakage that unit tests never catch.
      - name: kustomize build
        run: kubectl kustomize config/default > /dev/null

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build -t tenant-operator:ci .
